```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#401477">
  <title>New We-Care Computer ERP</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body.login-mode .app {
      display: none !important;
    }

    #loginScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f3f8;
      padding: 20px;
    }

    .login-card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 15px 45px rgba(0,0,0,.15);
      text-align: center;
    }

    .login-card h2 {
      margin: 20px 0 8px;
    }

    .login-card form {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .login-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d7d2df;
      border-radius: 8px;
      font-size: 15px;
    }

    .login-card button {
      padding: 12px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .login-error {
      min-height: 20px;
      color: #b42318;
      font-size: 14px;
    }
  </style>
</head>

<body class="login-mode">

  <div id="loginScreen">
    <div class="login-card">

      <div class="brand">
        NEW WE-CARE<br>
        <span>COMPUTER ERP</span>
      </div>

      <h2>Login</h2>

      <form id="loginForm">
        <input
          id="loginUsername"
          type="text"
          autocomplete="username"
          placeholder="Username"
          required
        >

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
        >

        <button class="primary" type="submit">
          Login
        </button>

        <div id="loginError" class="login-error"></div>
      </form>

    </div>
  </div>


  <div class="app">

    <aside class="sidebar">

      <div class="brand">
        NEW WE-CARE<br>
        <span>COMPUTER ERP</span>
      </div>

      <button class="nav active" data-page="dashboard">
        Dashboard
      </button>

      <button class="nav" data-page="products">
        Inventory
      </button>

      <button class="nav" data-page="customers">
        Customers
      </button>

      <button class="nav" data-page="suppliers">
        Suppliers
      </button>

      <button class="nav" data-page="sales">
        Sales Bill
      </button>

      <button class="nav" data-page="quotations">
        Quotation
      </button>

      <button class="nav" data-page="purchases">
        Purchase
      </button>

      <button class="nav" data-page="deliveryChallans">
        Delivery Challan
      </button>

      <button class="nav" data-page="warranties">
        Warranty In / Out
      </button>

      <button class="nav" data-page="cctvProjects">
        CCTV Projects
      </button>

      <button class="nav" data-page="company">
        Company Profile
      </button>

      <button class="nav" data-page="reports">
        Reports
      </button>

      <button class="nav" data-page="settings">
        Settings
      </button>

    </aside>


    <main>

      <button
        class="mobileMenu"
        onclick="document.querySelector('.sidebar').classList.toggle('open')"
      >
        ☰
      </button>

      <header>

        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <small>
            CCTV • Computer • Printer • Networking • Security Solutions
          </small>
        </div>

        <div class="headerUser">

          <span id="userRole"></span>

          <button
            id="exportBackupBtn"
            class="primary"
            onclick="exportData()"
          >
            Export Backup
          </button>

          <button
            class="logoutBtn"
            onclick="logout()"
          >
            Logout
          </button>

        </div>

      </header>

      <section id="content"></section>

    </main>


    <div class="bottomNav">

      <button onclick="render('dashboard')">
        🏠
        <small>Home</small>
      </button>

      <button onclick="render('sales')">
        🧾
        <small>Sales</small>
      </button>

      <button onclick="render('quotations')">
        📄
        <small>Quote</small>
      </button>

      <button onclick="render('purchases')">
        🛒
        <small>Purchase</small>
      </button>

    </div>

  </div>


  <script src="assets/app.js"></script>

</body>
</html>
```

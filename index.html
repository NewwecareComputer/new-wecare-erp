       LOGIN CONTROLLER
  ========================== -->

  <script>

    const loginScreen =
      document.getElementById('loginScreen');

    const erpApp =
      document.getElementById('erpApp');

    const loginForm =
      document.getElementById('loginForm');

    const loginError =
      document.getElementById('loginError');

    const loginBtn =
      document.getElementById('loginBtn');


    function showLogin() {

      loginScreen.style.display = 'flex';
      erpApp.style.display = 'none';

      document.body.classList.remove(
        'staffUser'
      );
    }


    function showERP(user) {

      loginScreen.style.display = 'none';
      erpApp.style.display = 'flex';

      const roleElement =
        document.getElementById('userRole');

      if (user.role === 'admin') {

        roleElement.textContent =
          '👑 Admin';

        document.body.classList.remove(
          'staffUser'
        );

      } else {

        roleElement.textContent =
          '👤 Staff';

        document.body.classList.add(
          'staffUser'
        );
      }

      /*
        Dashboard open after login.
      */

      try {

        if (typeof render === 'function') {
          render('dashboard');
        }

      } catch (err) {

        console.error(
          'ERP render error:',
          err
        );
      }
    }


    loginForm.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();

        loginError.style.display = 'none';

        const username =
          document.getElementById(
            'loginUsername'
          ).value.trim();

        const password =
          document.getElementById(
            'loginPassword'
          ).value;


        if (!username || !password) {

          loginError.textContent =
            'Please enter username and password';

          loginError.style.display = 'block';

          return;
        }


        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';


        try {

          const response =
            await fetch(
              '/api/auth/login',
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body: JSON.stringify({
                  username,
                  password
                })
              }
            );


          const result =
            await response.json();


          if (
            !response.ok ||
            !result.ok
          ) {

            throw new Error(
              result.error ||
              'Invalid username or password'
            );
          }


          /*
            Store login locally so page refresh
            does not immediately return to login.
          */

          localStorage.setItem(
            'new_wecare_logged_user',
            JSON.stringify(result.user)
          );


          showERP(result.user);


        } catch (error) {

          console.error(
            'Login error:',
            error
          );

          loginError.textContent =
            error.message ||
            'Login failed';

          loginError.style.display =
            'block';

        } finally {

          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';

        }

      }
    );


    function logout() {

      localStorage.removeItem(
        'new_wecare_logged_user'
      );

      showLogin();

      document.getElementById(
        'loginPassword'
      ).value = '';

    }


    /*
      Check existing login
    */

    (function checkLogin() {

      try {

        const saved =
          localStorage.getItem(
            'new_wecare_logged_user'
          );


        if (saved) {

          const user =
            JSON.parse(saved);


          if (
            user &&
            (
              user.role === 'admin' ||
              user.role === 'staff'
            )
          ) {

            showERP(user);

            return;
          }
        }

      } catch (error) {

        console.error(
          'Saved login error:',
          error
        );

        localStorage.removeItem(
          'new_wecare_logged_user'
        );
      }


      showLogin();

    })();

  </script>

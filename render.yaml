services:
  - type: web
    name: new-wecare-erp-live
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: new-wecare-erp-db
          property: connectionString
      - key: ERP_IMPORT_KEY
        sync: false
databases:
  - name: new-wecare-erp-db
    plan: free
